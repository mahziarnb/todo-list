<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo list</title>
    <link rel="stylesheet" href="assets/css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="bg-tint flex flex-center">
    <!-- Include this script tag or install `@tailwindplus/elements` via npm: -->
<!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script> -->
<el-dialog>
  <dialog id="dialog" aria-labelledby="dialog-title" class="fixed inset-0  size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
    <el-dialog-backdrop class="fixed inset-0 bg-gray-900/50 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"></el-dialog-backdrop>

    <div tabindex="0" class="flex min-h-full items-center justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0">
      <el-dialog-panel class="relative transform overflow-hidden rounded-lg bg-gray-800 text-left shadow-xl outline -outline-offset-1 outline-white/10 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-lg data-closed:sm:translate-y-0 data-closed:sm:scale-95">
        <div class="bg-shade px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
          <div class="sm:flex sm:items-start">
            <div class="mx-auto flex size-12 shrink-0 items-center justify-center rounded-full bg-red-500/10 sm:mx-0 sm:size-10">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6 text-red-400">
                <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
              <h3 id="dialog-title" class="text-base font-semibold text-white">Warning</h3>
              <div class="mt-2">
                <p class="text-sm text-light">Are you sure you want to delete your task?</p>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-shade/75 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
          <button type="button" id="yesModal" command="close" commandfor="dialog" class="inline-flex w-full justify-center rounded-md bg-red-500 px-3 py-2 text-sm font-semibold text-white hover:bg-red-400 sm:ml-3 sm:w-auto">Yes</button>
          <button type="button" command="close" commandfor="dialog" class="mt-3 inline-flex w-full justify-center rounded-md bg-white/10 px-3 py-2 text-sm font-semibold text-white inset-ring inset-ring-white/5 hover:bg-white/20 sm:mt-0 sm:w-auto">Cancel</button>
        </div>
      </el-dialog-panel>
    </div>
  </dialog>
</el-dialog>
    <!-- main -->
    <section class="main lg:h-screen w-full max-w-[1200px] ">
        <!-- main container -->
        <div class="main-container  w-full flex flex-col md:flex-row md:gap-5 flex-center py-5 overflow-hidden px-5">


            <!-- left section -->
            <section class="left flex justify-center flex-col pb-7">

                <h1 class="font-black text-6xl text-shade tracking-wide text-center md:text-left">ToDo List</h1>

                <p class="text-2xl text-light py-5 text-center md:text-left ">Lets Accomplish Tasks Together!</p>

                <div class="image w-full">
                    <div class="size-[23rem] ">
                        <img src="assets/image/Owl.png" class="owl w-full h-full" alt="owl image">
                    </div>
                </div>

            </section>

            <!-- right section -->
            <section class="right w-full lg:w-[40%]  h-[480px] bg-shade px-7 py-8 rounded-xl">

                <h1 class="text-2xl text-center text-light font-bold">Get Things Done !</h1>

                <!-- add task -->
                <div class="add-task flex mt-6 ">
                    <input id="add-task-input" type="text" placeholder="What is the task today?" class="bg-transparent placeholder-tint/30   border border-r-0 text-tint border-tint pl-4 pr-3 py-1 grow outline-none">
                    <button id="addBtn" type="button" class="addBtn bg-tint border border-l-0 border-tint text-sm md:text-[.9rem] px-2 text-nowrap font-medium py-1 text-light  tracking-wide">Add Task</button>
                </div>
                <!-- input error -->
                <p id="input-error" class="hide text-red-600 text-sm mt-1">Please enter content !</p>

                <!-- tasks container -->
                <ul id="tasks-list" class="tasks flex flex-col mt-[3rem]  gap-4 max-h-[290px] overflow-y-auto scrollbar-thin">

                </ul>

            </section>


        </div>

    </section>

<script src="assets/js/script.js"></script>
</body>
</html>
